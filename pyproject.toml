[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vit-under-the-hood"
version = "0.1.0"
description = "From-scratch PyTorch implementation of Vision Transformer with attention dynamics experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Aliou Diallo"}
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "einops>=0.7.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pillow>=9.5.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "imageio>=2.30.0",
    "gradio>=4.0.0",
    "torchinfo>=1.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "ruff>=0.1.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
